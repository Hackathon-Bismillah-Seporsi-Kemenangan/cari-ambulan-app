name: cari_ambulan
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  vector_map_tiles: ^9.0.0-beta.13
  vector_tile_renderer: ^6.1.0
  http: ^1.6.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  geolocator: ^14.1.2
  flutter_secure_storage: ^11.2.0
  vibration: ^3.2.1
  flutter_local_notifications: ^22.3.3
  geocoding: ^5.0.1

  # Local storage - to persist onboarding completion & user role
  shared_preferences: ^2.3.3
  share_plus: ^13.3.1
  livekit_client: ^2.3.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/map/
