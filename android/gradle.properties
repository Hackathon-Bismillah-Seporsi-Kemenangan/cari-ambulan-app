# 4 GB is plenty for this app. The template's 8 GB made laptops with 8 GB of
# RAM swap for the whole build.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Reuse task outputs between builds and build modules in parallel.
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
